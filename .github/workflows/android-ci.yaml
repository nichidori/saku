name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set execute permissions for Gradle
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set execute permissions for Gradle
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :shared:jvmTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: |
            **/build/test-results/
            **/build/reports/tests/

  release:
    name: Build release APK and deploy to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, unit-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set execute permissions for Gradle
        run: chmod +x gradlew

      - name: Setup signing files from secrets
        env:
          KEY_PROPERTIES_B64: ${{ secrets.KEY_PROPERTIES_BASE64 }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEY_PROPERTIES_B64" ]; then
            echo "::error::Missing secret KEY_PROPERTIES_BASE64 (base64-encoded key.properties)"
            exit 1
          fi
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64 (base64-encoded .jks)"
            exit 1
          fi
          echo "$KEY_PROPERTIES_B64" | base64 --decode > key.properties
          echo "$KEYSTORE_B64" | base64 --decode > release-key.jks
          # key.properties may contain a local absolute storeFile path;
          # point it at the decoded keystore in the workspace instead.
          if grep -q '^storeFile=' key.properties; then
            sed -i "s|^storeFile=.*|storeFile=$GITHUB_WORKSPACE/release-key.jks|" key.properties
          else
            echo "storeFile=$GITHUB_WORKSPACE/release-key.jks" >> key.properties
          fi
          echo "key.properties keys:" && cut -d= -f1 key.properties
          ls -l key.properties release-key.jks

      - name: Build release APK (prod)
        run: ./gradlew :composeApp:assembleProdRelease

      - name: Rename APK with tag version
        run: |
          set -e
          APK_DIR="composeApp/build/outputs/apk/prod/release"
          APK_FILE=$(find "$APK_DIR" -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK not found in $APK_DIR"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          NEW_NAME="saku-${VERSION}-prod.apk"
          mv "$APK_FILE" "$APK_DIR/$NEW_NAME"
          echo "APK prepared: $APK_DIR/$NEW_NAME"
          ls -l "$APK_DIR"

      - name: Deploy to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: composeApp/build/outputs/apk/prod/release/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}